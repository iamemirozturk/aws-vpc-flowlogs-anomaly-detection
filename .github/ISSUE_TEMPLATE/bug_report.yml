name: Bug report
description: Report a reproducible defect in the Terraform, detector, or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include account IDs, credentials, query results, or sensitive Flow Log data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps.
    validations:
      required: true
  - type: input
    id: terraform
    attributes:
      label: Terraform and AWS provider versions
      placeholder: Terraform 1.x, AWS provider 6.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      render: shell
