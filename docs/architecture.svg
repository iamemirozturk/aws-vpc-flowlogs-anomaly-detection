<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Centralized VPC Flow Logs anomaly detection architecture</title>
  <desc id="desc">Spoke VPC Flow Logs deliver Parquet objects directly to encrypted central S3. Glue partition projection and Athena support a scheduled Lambda detector with DynamoDB idempotency, SNS alerts, an EventBridge dead-letter queue, and CloudWatch alarms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#475569}
      .boundary{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:10 8}.boundaryTitle{font:700 20px Arial,sans-serif;fill:#334155}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14;filter:url(#shadow)}.aws{fill:#fff7ed;stroke:#f59e0b}.security{fill:#eff6ff;stroke:#3b82f6}.reliability{fill:#f0fdf4;stroke:#22c55e}
      .label{font:700 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:400 13px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.arrowLabel{font:600 13px Arial,sans-serif;fill:#334155;text-anchor:middle}
      .state{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:12}.stateText{font:600 14px Arial,sans-serif;fill:#5b21b6;text-anchor:middle}.legend{font:400 13px Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="52" class="title" text-anchor="middle">Centralized VPC Flow Logs anomaly detection</text>
  <text x="800" y="82" class="subtitle" text-anchor="middle">Direct cross-account S3 delivery • projected Parquet partitions • delayed rolling-window detection</text>

  <rect x="45" y="125" width="410" height="650" rx="22" class="boundary"/>
  <text x="70" y="162" class="boundaryTitle">Spoke account / Region (repeat N)</text>
  <rect x="90" y="210" width="320" height="100" class="box aws"/>
  <text x="250" y="250" class="label">VPC workloads</text>
  <text x="250" y="276" class="small">VPCs • ENIs • packet context</text>
  <rect x="90" y="385" width="320" height="125" class="box aws"/>
  <text x="250" y="425" class="label">VPC Flow Logs</text>
  <text x="250" y="452" class="small">ACCEPT + REJECT • enriched fields</text>
  <text x="250" y="475" class="small">Parquet • Hive prefixes • hourly</text>
  <path d="M250 310V385" class="arrow"/>
  <text x="285" y="353" class="arrowLabel">collect</text>
  <rect x="90" y="625" width="320" height="85" class="state"/>
  <text x="250" y="660" class="stateText">Independent spoke Terraform state</text>
  <text x="250" y="683" class="small">explicit assume role + account guard</text>

  <rect x="510" y="125" width="1045" height="650" rx="22" class="boundary"/>
  <text x="535" y="162" class="boundaryTitle">Security / Logging account</text>
  <rect x="555" y="210" width="300" height="130" class="box security"/>
  <text x="705" y="250" class="label">Central S3</text>
  <text x="705" y="277" class="small">KMS • versioning • TLS only</text>
  <text x="705" y="300" class="small">account / Region / hour prefixes</text>
  <path d="M410 447C475 447 480 275 555 275" class="arrow"/>
  <text x="486" y="392" class="arrowLabel">delivery.logs.amazonaws.com</text>
  <text x="486" y="413" class="small">source account + source ARN</text>

  <rect x="940" y="190" width="250" height="95" class="box aws"/>
  <text x="1065" y="228" class="label">Glue Data Catalog</text>
  <text x="1065" y="254" class="small">explicit schema + projection</text>
  <rect x="940" y="335" width="250" height="105" class="box aws"/>
  <text x="1065" y="375" class="label">Amazon Athena</text>
  <text x="1065" y="401" class="small">Engine 3 • scan cutoff</text>
  <path d="M855 255L940 237M855 305C895 320 905 387 940 387M1065 285V335" class="arrow"/>

  <rect x="1260" y="335" width="245" height="105" class="box security"/>
  <text x="1382" y="375" class="label">Lambda detector</text>
  <text x="1382" y="401" class="small">exact delayed window</text>
  <path d="M1260 387H1190" class="arrow"/>
  <rect x="1260" y="190" width="245" height="80" class="box aws"/>
  <text x="1382" y="224" class="label">EventBridge</text>
  <text x="1382" y="248" class="small">scheduled event timestamp</text>
  <path d="M1382 270V335" class="arrow"/>

  <rect x="940" y="505" width="250" height="95" class="box reliability"/>
  <text x="1065" y="543" class="label">DynamoDB</text>
  <text x="1065" y="569" class="small">completed-window idempotency</text>
  <path d="M1320 440C1300 520 1245 552 1190 552" class="arrow"/>
  <rect x="1260" y="505" width="245" height="95" class="box reliability"/>
  <text x="1382" y="543" class="label">Amazon SNS</text>
  <text x="1382" y="569" class="small">encrypted bounded alerts</text>
  <path d="M1382 440V505" class="arrow"/>

  <rect x="555" y="505" width="300" height="95" class="box reliability"/>
  <text x="705" y="543" class="label">SQS dead-letter queue</text>
  <text x="705" y="569" class="small">failed EventBridge delivery</text>
  <path d="M1260 230C1020 115 710 160 705 505" class="arrow"/>

  <rect x="940" y="645" width="565" height="80" class="box reliability"/>
  <text x="1222" y="678" class="label">CloudWatch logs, metrics, and alarms</text>
  <text x="1222" y="703" class="small">Lambda errors • throttles • DLQ messages</text>
  <path d="M1382 600V645M1065 600V645" class="arrow"/>
  <rect x="555" y="645" width="300" height="80" class="state"/>
  <text x="705" y="678" class="stateText">Independent central Terraform state</text>
  <text x="705" y="701" class="small">security-account credentials</text>

  <rect x="45" y="815" width="1510" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="75" cy="839" r="8" fill="#f59e0b"/><text x="92" y="844" class="legend">AWS data/query service</text>
  <circle cx="285" cy="839" r="8" fill="#3b82f6"/><text x="302" y="844" class="legend">security data path</text>
  <circle cx="505" cy="839" r="8" fill="#22c55e"/><text x="522" y="844" class="legend">resilience/operations</text>
  <rect x="710" y="831" width="17" height="17" rx="4" fill="#f5f3ff" stroke="#8b5cf6"/><text x="737" y="844" class="legend">separate state boundary</text>
  <text x="1515" y="844" class="legend" text-anchor="end">No cross-account IAM delivery role</text>
</svg>
