name: Quality and security

on:
  push:
    branches: [aws, main, develop]
  pull_request:
    branches: [aws, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.15.6"

jobs:
  quality:
    name: Terraform and Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate central root
        run: |
          terraform init -backend=false
          terraform validate -no-color
          terraform test -no-color

      - name: Test central logging module
        working-directory: modules/central-logging
        run: |
          terraform init -backend=false
          terraform validate -no-color
          terraform test -no-color

      - name: Validate spoke root
        working-directory: deployments/spoke
        run: |
          terraform init -backend=false
          terraform validate -no-color
          terraform test -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests and lint
        run: |
          python -m pytest --quiet
          python -m flake8 lambda

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tfsec
        env:
          TFSEC_ARCHIVE: tfsec_1.28.14_linux_amd64.tar.gz
          TFSEC_SHA256: 329ae7f67f2f1813ebe08de498719ea7003c75d3ca24bb0b038369062508008e
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "${TFSEC_ARCHIVE}" \
            "https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/${TFSEC_ARCHIVE}"
          echo "${TFSEC_SHA256}  ${TFSEC_ARCHIVE}" | sha256sum --check
          tar -xzf "${TFSEC_ARCHIVE}" tfsec

      - name: Scan Terraform
        run: |
          ./tfsec --version
          ./tfsec \
            --minimum-severity HIGH \
            --exclude-downloaded-modules \
            --format sarif \
            --out results.sarif \
            .
          test -s results.sarif

      - name: Upload tfsec SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: results.sarif
          category: tfsec

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Terraform
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          quiet: true
          soft_fail: false

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: checkov.sarif
          category: checkov
