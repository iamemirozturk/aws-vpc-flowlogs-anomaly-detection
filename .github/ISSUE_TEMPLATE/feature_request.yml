name: Feature request
description: Propose a scoped security or reliability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Security or operational problem
      description: Describe the threat, failure mode, or analyst need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include alternatives, cost impact, and compatibility concerns.
    validations:
      required: true
